<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 | AQUABIT</title>
  <link rel="stylesheet" href="/community/css/base.css?v=2">
  <link rel="stylesheet" href="/community/css/pages.css">
  <link rel="stylesheet" href="/play/community-shared.css">
  <link rel="stylesheet" href="/community/css/admin.css">
  <link rel="stylesheet" href="/community/css/site.css">
</head>
<body class="site-skin sea-bg admin-page">
  <header class="site-top">
    <div class="site-top-inner">
      <div class="top-left">
        <a class="brand" href="/" aria-label="AQUABIT 홈"><img src="/img/logo.svg" alt="AQUABIT" width="174" height="27"></a>
        <span class="badge">관리자</span>
      </div>
      <div class="bar-user">
        <a class="btn btn--foam btn--small" href="/community/tanks.html">내 어항</a>
        <button class="btn btn--foam btn--small" id="logoutBtn" type="button">로그아웃</button>
      </div>
    </div>
  </header>

  <section class="site-hero">
    <div class="site-hero-inner">
      <p class="eyebrow">ADMIN</p>
      <h1 class="site-hero-title">관리자</h1>
      <p class="site-hero-lead">모든 어항과 사용자를 보고, 진주·아이템을 지급하고, 공지를 보내요.</p>
    </div>
  </section>

  <main class="admin-main">
    <div class="admin-tabs" role="tablist" aria-label="관리 메뉴">
      <button class="admin-tab" role="tab" aria-selected="true" data-tab="overview" id="tab-overview" aria-controls="panel-overview">한눈에</button>
      <button class="admin-tab" role="tab" aria-selected="false" data-tab="tanks" id="tab-tanks" aria-controls="panel-tanks">어항</button>
      <button class="admin-tab" role="tab" aria-selected="false" data-tab="users" id="tab-users" aria-controls="panel-users">사용자</button>
      <button class="admin-tab" role="tab" aria-selected="false" data-tab="notices" id="tab-notices" aria-controls="panel-notices">공지</button>
    </div>

    <section class="admin-panel panel" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview">
      <h2 class="admin-title pixel">한눈에 보기</h2>
      <dl class="stats" id="stats"></dl>
    </section>

    <section class="admin-panel panel" id="panel-tanks" role="tabpanel" aria-labelledby="tab-tanks" hidden>
      <h2 class="admin-title pixel">모든 어항</h2>
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr><th>어항</th><th>초대 코드</th><th>대표</th><th>팀원 (아이디, 물고기 단계)</th><th>진행 중 과제</th><th>채팅</th><th></th></tr></thead>
          <tbody id="tankRows"></tbody>
        </table>
      </div>
    </section>

    <section class="admin-panel panel" id="panel-users" role="tabpanel" aria-labelledby="tab-users" hidden>
      <div class="panel-head">
        <h2 class="admin-title pixel">사용자</h2>
        <label class="sr-only" for="userSearch">아이디나 닉네임 검색</label>
        <input class="input search" id="userSearch" placeholder="아이디나 닉네임 검색">
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr><th>사용자</th><th>진주</th><th>먹이 / 장신구</th><th>들어간 어항</th><th>마지막 출석</th><th></th></tr></thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
    </section>

    <section class="admin-panel panel" id="panel-notices" role="tabpanel" aria-labelledby="tab-notices" hidden>
      <h2 class="admin-title pixel">공지 보내기</h2>
      <p class="admin-help">공지는 고른 어항의 채팅에 관리자 이름으로 남고, 지금 접속해 있는 사람에게는 화면 위에 바로 떠요.</p>
      <form class="notice-form" id="noticeForm" novalidate>
        <div class="field">
          <label for="noticeTarget">보낼 곳</label>
          <select class="input" id="noticeTarget"></select>
        </div>
        <div class="field">
          <label for="noticeBody">내용 <small>300자까지</small></label>
          <textarea class="input" id="noticeBody" rows="3" maxlength="300" placeholder="예: 이번 주 금요일까지 중간 발표 자료를 올려 주세요!"></textarea>
        </div>
        <p class="form-error" role="alert" id="noticeError"></p>
        <button class="btn btn--sea" type="submit">공지 보내기</button>
      </form>
    </section>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- 어항 수정 -->
  <dialog class="admin-dialog panel" id="tankDialog" aria-labelledby="tankDlgTitle">
    <form method="dialog" id="tankForm" novalidate>
      <h2 class="dlg-title pixel" id="tankDlgTitle">어항 수정</h2>
      <div class="field"><label for="tdName">어항 이름</label><input class="input" id="tdName" maxlength="20"></div>
      <div class="field"><label for="tdOwner">대표</label><select class="input" id="tdOwner"></select>
        <small class="field-help">대표를 바꾸면 새 대표가 맡고 있던 끝나지 않은 과제는 지워져요.</small></div>
      <label class="check"><input type="checkbox" id="tdCode"> 초대 코드 새로 만들기 <small>(이전 코드로는 더 이상 들어올 수 없어요)</small></label>
      <p class="form-error" role="alert" id="tdError"></p>
      <div class="dlg-actions">
        <button class="btn btn--foam" value="cancel" formnovalidate>취소</button>
        <button class="btn btn--sea" value="ok">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 지급 -->
  <dialog class="admin-dialog panel" id="grantDialog" aria-labelledby="grantDlgTitle">
    <form method="dialog" id="grantForm" novalidate>
      <h2 class="dlg-title pixel" id="grantDlgTitle">지급하기</h2>
      <p class="admin-help" id="grantWho"></p>
      <div class="field"><label for="gPearls">진주 <small>회수하려면 음수 (예: -20)</small></label><input class="input" id="gPearls" type="number" step="1" placeholder="0"></div>
      <div class="field-row">
        <div class="field"><label for="gItem">아이템</label>
          <select class="input" id="gItem"><option value="">없음</option><option value="food">먹이</option><option value="ribbon">리본</option><option value="hat">꽃</option><option value="crown">왕관</option></select></div>
        <div class="field"><label for="gQty">수량 <small>먹이만</small></label><input class="input" id="gQty" type="number" min="1" max="999" value="5"></div>
      </div>
      <div class="field"><label for="gReason">사유 <small>진주 내역에 남아요 (선택)</small></label><input class="input" id="gReason" maxlength="60" placeholder="예: 발표 우수 팀 보상"></div>
      <p class="form-error" role="alert" id="gError"></p>
      <div class="dlg-actions">
        <button class="btn btn--foam" value="cancel" formnovalidate>취소</button>
        <button class="btn btn--sea" value="ok">지급하기</button>
      </div>
    </form>
  </dialog>

  <!-- 삭제 확인 -->
  <dialog class="admin-dialog panel" id="delDialog" aria-labelledby="delDlgTitle">
    <form method="dialog" id="delForm">
      <h2 class="dlg-title pixel" id="delDlgTitle">어항 삭제</h2>
      <p class="admin-help" id="delText"></p>
      <p class="form-error" role="alert" id="delError"></p>
      <div class="dlg-actions">
        <button class="btn btn--foam" value="cancel">취소</button>
        <button class="btn btn--coral" value="ok">삭제하기</button>
      </div>
    </form>
  </dialog>

  <dialog class="admin-dialog panel" id="userDelDialog" aria-labelledby="userDelTitle">
    <form method="dialog" id="userDelForm">
      <h2 class="dlg-title pixel" id="userDelTitle">사용자 강제 탈퇴</h2>
      <p class="admin-help" id="userDelText"></p>
      <label class="check"><input type="checkbox" id="userDelAgree"> 되돌릴 수 없다는 것을 확인했어요</label>
      <p class="form-error" role="alert" id="userDelError"></p>
      <div class="dlg-actions">
        <button class="btn btn--foam" value="cancel">취소</button>
        <button class="btn btn--coral" value="ok">탈퇴시키기</button>
      </div>
    </form>
  </dialog>

  <script src="/community/js/api.js"></script>
  <script src="/community/js/pages/admin.js"></script>
</body>
</html>
